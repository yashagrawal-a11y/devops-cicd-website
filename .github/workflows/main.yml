name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test
        run: |
          echo "Running tests..."
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files are present"

      - name: Build
        run: |
          echo "Building website..."
          rm -rf dist
          mkdir dist
          cp index.html style.css script.js dist/
          echo "Build completed"

      - name: Debug OIDC Token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("OIDC issuer:", payload.iss);
            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Ref:", payload.ref);
            console.log("Event:", payload.event_name);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete
          echo "Deployment completed successfully"
